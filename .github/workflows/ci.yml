name: CI

# The "a stranger clones this and runs npm test" channel. Until now this repo had
# no CI at all, so its suite only ever ran on the author's machine with whatever
# environment happened to be loaded there. That is not a channel, it is a habit —
# and the sibling mcp-fairrent shipped four red commits in a row precisely because
# a local shell variable masked a failure CI would have caught on the first push.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow checks out and tests, and needs no write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two floors, and this matrix measures the higher one. package.json
        # declares engines >=18 for the RUNTIME; the DEV toolchain asks for
        # more (vitest 4.1.11 wants ^20 || ^22 || >=24, and the vite it pulls,
        # 8.2.2 as locked, wants ^20.19 || >=22.12). npm only WARNS on engines
        # unless engine-strict is set and this repo ships no .npmrc, so 18 is
        # untested here rather than known-broken -- which is what README's
        # "Two Node floors" paragraph says, and this comment used to contradict.
        # The server runs under tsx with no build step, so there is no tarball
        # stage to prove the lower bound against either.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Ten of these spawn `pwsh`, and nothing here installs it: ubuntu-latest
      # is Ubuntu 24.04 (actions/runner-images README) whose image ships
      # PowerShell 7.6.5 (images/ubuntu/Ubuntu2404-Readme.md, "PowerShell
      # Tools"). That is the vendor's manifest, not a measurement — this
      # workflow has never run, so whether those ten pass on Linux is unknown
      # until the first push, and a red here is a finding rather than a fluke.
      - run: npm test
      # Unlike the sibling scryfall server, this smoke is OFFLINE — it spawns the
      # real server over stdio and checks the error paths and the run-script
      # marker contract without touching a network or a running game. That makes
      # it safe to run on every push, and it is the only rung that exercises the
      # actual process boundary rather than an imported module.
      - run: npm run smoke
